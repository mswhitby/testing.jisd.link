<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Check-In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="min-h-screen flex flex-col items-center justify-center p-4">
    <header class="w-full max-w-4xl text-center mb-8 header-wrap">
      <h1 class="text-4xl md:text-5xl font-bold text-blue-500 mb-2">Gym Check-In</h1>
      <p class="text-gray-300 text-lg">Enter your Student ID to find your gym assignment and check in.</p>
    </header>

    <section id="searchPanel" class="search-box w-full max-w-2xl bg-white rounded-lg p-6 md:p-8">
      <div class="flex flex-col md:flex-row gap-4">
        <input
          type="text"
          id="studentID"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Enter your Student ID"
          class="flex-grow px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 text-lg"
        >
        <button id="lookupBtn" class="bg-blue-600 hover:bg-blue-700 transition-colors text-white font-bold px-6 py-3 rounded-lg text-lg">
          Find Assignment
        </button>
      </div>
      <div id="lookupMessage" class="hidden mt-4 text-center" role="status" aria-live="polite"></div>
    </section>

    <section id="assignmentPanel" class="result-card w-full max-w-2xl mt-8 bg-black bg-opacity-80 rounded-lg p-6 hidden" aria-live="polite">
      <div class="flex items-center border-b border-blue-600 pb-4 mb-6">
        <div class="bg-blue-600 rounded-full p-3 mr-4 flex-shrink-0 text-white text-2xl font-bold">✓</div>
        <div>
          <h2 id="studentName" class="text-2xl font-bold text-white"></h2>
          <p class="text-gray-400">Student ID: <span id="studentIDDisplay"></span></p>
        </div>
      </div>

      <div class="assignment-card">
        <div id="testName" class="card-activity"></div>
        <div class="card-meta">
          <span id="testDate" class="card-meta-date"></span>
          <span id="testRoom" class="card-meta-room"></span>
        </div>
      </div>

      <div id="checkInStatus" class="mt-5 rounded-lg border border-gray-700 bg-gray-900 p-4 hidden">
        <div class="flex justify-between gap-4 text-gray-200">
          <span id="morningStatusLabel">Check-In</span>
          <span id="morningStatus" class="font-bold"></span>
        </div>
        <div id="afterLunchStatusRow" class="flex justify-between gap-4 text-gray-200 mt-2 hidden">
          <span>After lunch</span>
          <span id="afterLunchStatus" class="font-bold"></span>
        </div>
        <p id="lunchTimeMessage" class="text-gray-400 text-sm mt-3 hidden"></p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
        <button id="morningCheckInBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">Click to Check-In</button>
        <button id="afterLunchCheckInBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors hidden">Click to Check-In</button>
      </div>
      <button id="newLookupBtn" class="w-full bg-gray-700 text-white font-bold py-3 rounded-lg hover:bg-gray-600 transition-colors mt-3">Search Again</button>
      <div id="checkInMessage" class="hidden mt-4 text-red-400 text-center" role="status" aria-live="polite"></div>
    </section>

  </main>

  <script src="gym.js?v=20261026-2"></script>
</body>
</html>
